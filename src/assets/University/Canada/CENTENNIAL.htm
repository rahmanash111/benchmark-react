                        <div data-component="sliderTestimonial" data-type="layer" data-json="{&quot;backgroundLayerColor&quot;:&quot;white&quot;,&quot;layerDescription&quot;:&quot;Layer dedicated to the testimonials.&quot;,&quot;items&quot;:[{&quot;fullName&quot;:&quot;Helena Pieroni&quot;,&quot;programName&quot;:&quot;Practical Nursing, Graduate&quot;,&quot;quote&quot;:&quot;Clinical placement really put me &lt;span class=&#39;txt-bold&#39;&gt;face-to-face with reality,&lt;/span&gt; but I realized that even little details in class or in the lab gave me the background to &lt;span class=&#39;txt-bold&#39;&gt;test my skills&lt;/span&gt; and improve them.&quot;,&quot;desktopImageUrl&quot;:&quot;https://cdn.centennialcollege.ca/ccwiden/content/kfgxxjwtw2/png/helena-pieroni.png?w=400&amp;h=400&amp;keep=c&amp;crop=yes&amp;color=ffffffff&amp;quality=80&amp;u=gxypq6&quot;,&quot;mediaDescription&quot;:&quot;Helena Pieroni&quot;,&quot;caption&quot;:&quot;&quot;},{&quot;fullName&quot;:&quot;Joshua Panganiban &quot;,&quot;programName&quot;:&quot;Personal Support, Graduate&quot;,&quot;quote&quot;:&quot;What &lt;span class=&#39;txt-bold&#39;&gt;I learned the first day&lt;/span&gt; had nothing to do with anatomy or the foundations of personal support workers. What I learned was that everyone around me wanted me to &lt;span class=&#39;txt-bold&#39;&gt; succeed&lt;/span&gt;, and were willing to go out of their way to help me reach that. In the first week, my teachers made sure to update me on what I needed to do for the week so I don&#39;t miss out on any marks. They could&#39;ve just left me out in the dust, made me figure out everything myself, but they didn&#39;t, as &lt;span class=&#39;txt-bold&#39;&gt;they cared for my success&lt;/span&gt;, and that is truly what Centennial College is all about.&quot;,&quot;desktopImageUrl&quot;:&quot;https://cdn.centennialcollege.ca/widencdn/img/centennialcollege/in22akqtfj/400x400px/joshua-panganiban.jpeg?keep=c&amp;crop=yes&amp;quality=100&amp;u=m3v3qo&quot;,&quot;mediaDescription&quot;:&quot;Headshot of Joshua Panganiban&quot;,&quot;caption&quot;:&quot;&quot;},{&quot;fullName&quot;:&quot;Maria Kazzaz&quot;,&quot;programName&quot;:&quot;General Arts and Sciences - English for Academic Purposes, Graduate&quot;,&quot;quote&quot;:&quot;This program was &lt;span class=&#39;txt-bold&#39;&gt;very helpful&lt;/span&gt; for me. I &lt;span class=&#39;txt-bold&#39;&gt;feel more confident&lt;/span&gt; now. I am very happy.&quot;,&quot;desktopImageUrl&quot;:&quot;https://cdn.centennialcollege.ca/ccwiden/content/ohxdo5dnuy/jpeg/Maria%20Kazzaz.jpg?w=250&amp;h=250&amp;position=c&amp;color=ffffffff&amp;quality=80&amp;u=qeyxqw&quot;,&quot;mediaDescription&quot;:&quot;Headshot of Maria Kazzaz  looking at the camera.&quot;,&quot;caption&quot;:&quot;&quot;},{&quot;fullName&quot;:&quot;Chantelle Fogarty-Griswold&quot;,&quot;programName&quot;:&quot;Professional Writing&quot;,&quot;quote&quot;:&quot;Centennial College has helped me in so many ways with my dream of becoming a writer by &lt;span class=&#39;txt-bold&#39;&gt;supporting me and advocating on my behalf&lt;/span&gt; to &lt;span class=&#39;txt-bold&#39;&gt;make sure I succeed&lt;/span&gt; in all aspects of my education. All my life, I knew I wanted to go in a field of study where I could help individuals with special needs, but because of all my health conditions, I didn&#39;t know how. When I looked at the courses at Centennial College, I found this course, Professional Writing.\n\n&quot;,&quot;desktopImageUrl&quot;:&quot;https://cdn.centennialcollege.ca/ccwiden/content/njxqazgh9i/jpeg/chantelle-fogarty-griswold.png?w=250&amp;h=250&amp;position=c&amp;color=ffffffff&amp;quality=80&amp;u=qeyxqw&quot;,&quot;mediaDescription&quot;:&quot;Chantelle Fogarty-Griswold&quot;,&quot;caption&quot;:&quot;&quot;},{&quot;fullName&quot;:&quot;Hina Tariq&quot;,&quot;programName&quot;:&quot;Business Administration – Human Resources&quot;,&quot;quote&quot;:&quot;I never knew what my potential was until I joined Centennial College. It is here where I actually &lt;span class=&#39;txt-bold&#39;&gt;strive for excellence&lt;/span&gt; and thrive.\n\nThe classrooms felt like mini workshops where I could gain knowledge and enhance my technical and interpersonal skills to &lt;span class=&#39;txt-bold&#39;&gt;be competitive&lt;/span&gt; in the field of HR. At present, after four semesters, I feel &lt;span class=&#39;txt-bold&#39;&gt;confident in my abilities&lt;/span&gt; to step into the workforce. From formulating a resume to mock interviews, the co-op office helped me every step of the way in securing the position of HR coordinator at Silfab Solar Inc. The &lt;span class=&#39;txt-bold&#39;&gt;personalized support&lt;/span&gt;with in-person interviews along with site visits made me feel secure in my endeavours as I stepped into the workforce.&quot;,&quot;desktopImageUrl&quot;:&quot;https://cdn.centennialcollege.ca/ccwiden/content/yrireq8jcr/jpeg/hina-tariq.png?w=250&amp;h=250&amp;position=c&amp;color=ffffffff&amp;quality=80&amp;u=qeyxqw&quot;,&quot;mediaDescription&quot;:&quot;Hina Tariq&quot;,&quot;caption&quot;:&quot;&quot;},{&quot;fullName&quot;:&quot;H.L.&quot;,&quot;programName&quot;:&quot;MSc (OT), OT Reg. (Ont.), Graduate, Effective Writing for Healthcare Professionals&quot;,&quot;quote&quot;:&quot;This course was &lt;span class=&#39;txt-bold&#39;&gt;informative, practical and applicable&lt;/span&gt; for all healthcare professionals who write reports. The course content was very organized, easy to follow and clearly presented.  The examples and scenarios presented throughout the course to solidify the concepts were particularly useful and complemented the messages being portrayed. I will certainly be taking the information I learned from the course and apply it to everyday practice. &quot;},{&quot;fullName&quot;:&quot;F.J.&quot;,&quot;programName&quot;:&quot;Graduate, Effective Writing for Healthcare Professionals, Physiotherapist/Case Manager, GLA Rehab.&quot;,&quot;quote&quot;:&quot;This course helped to clarify what is (and what is not) professional medical report writing.  &lt;span class=&#39;txt-bold&#39;&gt;I would recommend it to anyone&lt;/span&gt; who wants to learn how to how to write professional healthcare reports.  The lessons are structured in bite-sized formats that are easy to follow and absorb. The examples presented are very helpful.  The instructor teaches how to write reports that are professional, easy to read and unbiased.&quot;},{&quot;fullName&quot;:&quot;M.M.&quot;,&quot;programName&quot;:&quot;Graduate, Effective Writing for Healthcare Professionals&quot;,&quot;quote&quot;:&quot;I appreciated the opportunity to work through the different modules contained in the course.  The &lt;span class=&#39;txt-bold&#39;&gt;online, self-paced format&lt;/span&gt; is highly convenient for the busy clinician.  The content systematically works through basics as well as more complex concepts for report writing, and provided practical tips that I have been able to implement in subsequent reports.  There are many interactive exercises which allow for knowledge checks and consolidation.&quot;}]}"></div>
